name: Build OpenBot v1.1.0 installers

on:
  push:
    branches: [codex/build-v1.1.0-assets]
    paths: [.github/workflows/build-release-v1.1.0.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install locked dependencies
        run: |
          pnpm approve-builds '!core-js' '!workerd'
          pnpm install --frozen-lockfile
      - name: Build macOS arm64 and x64 packages
        run: |
          pnpm package:prepare
          pnpm build:speech
          pnpm build:calendar
          pnpm build:photos
          pnpm build:cua
          if [ -L app ] && [ ! -e app ]; then unlink app; fi
          pnpm exec electron-builder --mac --publish never --config.mac.identity=- --config.mac.hardenedRuntime=false --config.dmg.sign=false
      - name: Verify macOS packages
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            dmg="release/OpenBot-1.1.0-${arch}.dmg"
            zip="release/OpenBot-1.1.0-${arch}.zip"
            hdiutil verify "$dmg"
            unzip -tq "$zip"
            fixture="$RUNNER_TEMP/openbot-${arch}"
            mkdir -p "$fixture"
            ditto -x -k "$zip" "$fixture"
            app="$fixture/OpenBot.app"
            resources="$app/Contents/Resources"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = 1.1.0
            if [ "$arch" = arm64 ]; then slice=arm64; else slice=x86_64; fi
            lipo -verify_arch "$slice" "$app/Contents/MacOS/OpenBot"
            test -s "$resources/zh-Hans.lproj/InfoPlist.strings"
            for helper in Calendar Photos Speech; do
              lipo -verify_arch "$slice" "$resources/OpenBot $helper.app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$resources/OpenBot $helper.app/Contents/Info.plist")"
            done
            codesign --verify --deep --strict "$app"
            node scripts/smoke-browser-bundle.mjs --resources "$resources" --target "darwin-${arch}" --check-only
          done
          resources="$RUNNER_TEMP/openbot-arm64/OpenBot.app/Contents/Resources"
          OMB_SMOKE_DIST="$resources/server" node scripts/smoke-packaged-server.mjs --browser-bundle "$resources/browser-engine"
          test -s release/latest-mac.yml
      - name: Upload verified macOS assets
        run: |
          gh release upload v1.1.0 \
            release/OpenBot-1.1.0-arm64.dmg release/OpenBot-1.1.0-arm64.dmg.blockmap \
            release/OpenBot-1.1.0-arm64.zip release/OpenBot-1.1.0-arm64.zip.blockmap \
            release/OpenBot-1.1.0-x64.dmg release/OpenBot-1.1.0-x64.dmg.blockmap \
            release/OpenBot-1.1.0-x64.zip release/OpenBot-1.1.0-x64.zip.blockmap \
            release/latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install locked dependencies
        run: |
          pnpm approve-builds '!core-js' '!workerd'
          pnpm install --frozen-lockfile
      - name: Build Windows x64 packages
        run: pnpm package:win
      - name: Verify packaged browser and server in isolated fixtures
        shell: pwsh
        run: |
          $resources = (Resolve-Path 'release/win-unpacked/resources').Path
          node scripts/smoke-browser-bundle.mjs --resources "$resources" --target win32-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OMB_SMOKE_DIST = Join-Path $resources 'server'
          node scripts/smoke-packaged-server.mjs --browser-bundle (Join-Path $resources 'browser-engine')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installerVersion = (Get-Item release/OpenBot-1.1.0-setup.exe).VersionInfo.ProductVersion
          if ($installerVersion -notmatch '^1\.1\.0(?:\.0)?$') { throw "Unexpected installer version $installerVersion" }
      - name: Upload verified Windows assets
        shell: pwsh
        run: |
          Copy-Item release/OpenBot-1.1.0-x64.zip release/OpenBot-1.1.0-windows-x64.zip
          Copy-Item release/OpenBot-1.1.0-setup.exe release/OpenBot-setup.exe
          gh release upload v1.1.0 release/OpenBot-1.1.0-setup.exe release/OpenBot-1.1.0-setup.exe.blockmap release/OpenBot-setup.exe release/OpenBot-1.1.0-windows-x64.zip release/latest.yml --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
